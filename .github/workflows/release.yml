name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  bump-homebrew-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: mdv
          homebrew-tap: Allra-Fintech/homebrew-tap
          commit-message: |
            Update {{formulaName}} to {{version}}
        env:
          # A fine-grained PAT scoped to contents:write on homebrew-tap only.
          # The built-in GITHUB_TOKEN cannot reach another repo, and the org's
          # ALLRA_GITHUB_TOKEN is visible to private repos only, so it arrives
          # empty here.
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
